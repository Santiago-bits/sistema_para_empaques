<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sin conexión</title>
    <style>
        :root { color-scheme: light dark; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: #f5f5f4; color: #1c1917; padding: 16px; box-sizing: border-box; }
        @media (prefers-color-scheme: dark) { body { background: #0c0a09; color: #f5f5f4; } .card { background: #1c1917 !important; border-color: #292524 !important; } }
        .card { max-width: 420px; background: #fff; border: 1px solid #e7e5e4; border-radius: 16px; padding: 28px; text-align: center; }
        img { width: 72px; height: 72px; }
        h1 { font-size: 1.3rem; margin: 16px 0 8px; }
        p { margin: 0 0 20px; line-height: 1.5; opacity: .8; }
        button { background: #16a34a; color: #fff; border: 0; border-radius: 10px; padding: 12px 22px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <img src="/icons/icon-192.png" alt="">
        <h1>Sin conexión con el sistema</h1>
        <p>No se pudo llegar al servidor. Revisá que la computadora tenga internet (o que esté conectada a la red del galpón) y volvé a intentar.
            Nada se guarda mientras no haya conexión.</p>
        <button type="button" onclick="location.reload()">Volver a intentar</button>
    </div>
</body>
</html>
